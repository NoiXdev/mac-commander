name: Feature request
description: Something MacCommander should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Requests are read and kept, and a request that describes the
        situation it came out of is far easier to design for than one that
        names a solution.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        The task, not the feature. "I sort camera imports into dated folders
        by hand and lose track of which ones I already moved" says more than
        "add a batch rename button" — it leaves room for an answer nobody has
        thought of yet.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In MacCommander, in Finder or another app, or by hand.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A shape you imagine, if you have one.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Browsing, list view or sidebar
        - Network shares
        - File operations (copy, move, trash, undo)
        - Archives
        - Convert
        - Dual-pane mode and keyboard
        - Search or tags
        - Preview pane or Quick Look
        - Open in Terminal
        - Show in Finder / default file browser / global hotkey
        - Settings
        - Somewhere else / not sure
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you post
      options:
        - label: I searched the existing issues and this is not already requested.
          required: true
