name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0) — must already exist'
        required: true

permissions:
  contents: write

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Full history + tags are required for conventional-changelog.
          fetch-depth: 0
          # Releases land on main. The default GITHUB_TOKEN pushes the
          # CHANGELOG commit directly, which works only while no branch
          # protection rule on main demands a PR or status checks.
          ref: main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Generate full CHANGELOG.md
        # This is a Swift package with no package.json. conventional-changelog
        # labels the newest section with package.json's version, so synthesize
        # a throwaway one from the tag (never committed). TAG comes in via env
        # so untrusted ref names are never interpolated into script text.
        # CHANGELOG.md does not exist yet; the first release creates it.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          printf '{"name":"maccommander","version":"%s"}\n' "${TAG#v}" > package.json
          npx -y conventional-changelog-cli@5 -p conventionalcommits -i CHANGELOG.md -s -r 0
          rm -f package.json
          # conventional-changelog can prepend a blank line; drop any leading
          # blank lines so the file always starts at the first version heading.
          sed -i '/./,$!d' CHANGELOG.md

      - name: Extract latest release notes
        # Slice out just the newest version section for the GitHub Release body.
        run: awk '/^#+ \[?v?[0-9]+\.[0-9]+/{c++} c==1' CHANGELOG.md > RELEASE_NOTES.md

      - name: Commit CHANGELOG back to main
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Stage first, then check the staged diff: `git diff --quiet` ignores
          # untracked files, so a freshly generated CHANGELOG.md (not yet
          # tracked) would be silently skipped.
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'CHANGELOG.md unchanged — nothing to commit.'
          else
            git commit -m "chore(release): $TAG [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create / update GitHub Release (draft until the DMG is up)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
          # `v*.*.*` also matches a pre-release tag like `v0.2.0-beta.1` —
          # flag it so `/latest` never offers a pre-release to stable users.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}

  build:
    name: Build, sign & notarize (macOS)
    needs: changelog
    outputs:
      sha256: ${{ steps.dmg.outputs.sha256 }}
    # Same label as ci.yml, so the gate and the shipped build read the same
    # compiler. scripts/build-app.sh -c release builds a universal app
    # (arm64 + x86_64, joined with lipo), as the Homebrew tap requires.
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # workflow_dispatch runs from a branch ref; build the TAGGED source
          # either way so a re-dispatch can never ship a moved HEAD.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Run tests
        # A tag can point at any commit — never sign and ship untested code.
        # MC_KEYCHAIN_TESTS stays unset (real Keychain). If this fails, the
        # changelog job's draft release is reused when the job is re-run.
        # Serial for the same reason as in ci.yml: a small runner.
        run: scripts/test.sh --no-parallel

      - name: Stamp the version from the tag
        # The committed Resources/Info.plist carries the development version.
        # The release must never be mislabelled, so the tag wins: its
        # version, without a pre-release suffix (CFBundleShortVersionString
        # is three integers), goes into the runner's copy only — nothing is
        # committed. The full version, suffix included, goes into the custom
        # NXReleaseVersion key: the update check reads it, so a beta is never
        # mistaken for its final release. CFBundleVersion takes the workflow run number so every
        # shipped build has a distinct, increasing build number.
        run: |
          set -euo pipefail
          version="${TAG#v}"
          short="${version%%-*}"
          plist=Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $short" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$plist"
          /usr/libexec/PlistBuddy -c "Set :NXReleaseVersion $version" "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NXReleaseVersion string $version" "$plist"
          echo "CFBundleShortVersionString=$short NXReleaseVersion=$version CFBundleVersion=$GITHUB_RUN_NUMBER"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Find the Developer ID identity
        # scripts/build-app.sh signs with MC_SIGN_IDENTITY and falls back to
        # ad-hoc when it is empty — which must never reach a release, so an
        # empty result fails here instead.
        run: |
          set -euo pipefail
          identity=$(security find-identity -v -p codesigning \
            | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)
          [ -n "$identity" ] || { echo "::error::no 'Developer ID Application' identity in the imported certificate" >&2; exit 1; }
          echo "Signing as: $identity"
          echo "MC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Prepare notarization credentials
        # App Store Connect API key, as in macSCP. scripts/build-app.sh only
        # knows a local keychain profile (MC_NOTARY_PROFILE), so notarization
        # runs in the steps below rather than in the script.
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"

      - name: Build and sign the app
        # Release configuration, signed with the Developer ID identity and
        # the hardened runtime. MC_NOTARY_PROFILE stays unset, so the script
        # stops after signing and leaves notarization to the next step.
        run: |
          set -euo pipefail
          scripts/build-app.sh -c release
          codesign --verify --deep --strict build/MacCommander.app
          # `-dvv`, not `-dv`: codesign prints `Authority=` lines only at
          # verbosity 2.
          echo "signed: $(codesign -dvv build/MacCommander.app 2>&1 | grep '^Authority=Developer ID Application')"

      - name: Notarize and staple the app
        # Notarization waits on Apple's notary service, which can take
        # several minutes with no output — not a hang. `|| true`: a rejected
        # submission exits non-zero, which would abort before the guidance
        # below; the grep on the captured JSON decides acceptance.
        run: |
          set -euo pipefail
          mkdir -p dist
          ZIP="dist/MacCommander-${VERSION}.zip"
          ditto -c -k --keepParent build/MacCommander.app "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --output-format json | tee dist/notary-app.json || true
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"Accepted"' dist/notary-app.json || {
            echo "::error::app notarization not accepted — fetch the log with: xcrun notarytool log <submission-id> --key … --key-id … --issuer …" >&2
            exit 1; }
          xcrun stapler staple build/MacCommander.app
          rm -f "$ZIP"

      - name: Build, sign, notarize and staple the DMG
        # Built from the STAPLED app, so the app inside works offline too.
        run: |
          set -euo pipefail
          DMG="dist/MacCommander-${VERSION}.dmg"
          STAGING="$RUNNER_TEMP/dmg-staging"
          rm -rf "$STAGING"; mkdir -p "$STAGING"
          cp -R build/MacCommander.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "MacCommander" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          rm -rf "$STAGING"
          codesign --force --timestamp --sign "$MC_SIGN_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --output-format json | tee dist/notary-dmg.json || true
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"Accepted"' dist/notary-dmg.json || {
            echo "::error::DMG notarization not accepted — fetch the log with: xcrun notarytool log <submission-id> --key … --key-id … --issuer …" >&2
            exit 1; }
          xcrun stapler staple "$DMG"

      - name: Final proof
        run: |
          set -euo pipefail
          spctl --assess --type execute -v build/MacCommander.app
          codesign --verify --deep --strict build/MacCommander.app
          spctl --assess --type open --context context:primary-signature -v dist/MacCommander-"$VERSION".dmg
          xcrun stapler validate build/MacCommander.app
          xcrun stapler validate dist/MacCommander-"$VERSION".dmg
          echo "RELEASE OK: dist/MacCommander-$VERSION.dmg"

      - name: Clean up notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/apple_api_key.p8"

      - name: Checksum the DMG
        # Printed and exposed as a job output: the `tap` job below hands it to
        # the Homebrew cask.
        id: dmg
        run: |
          set -uo pipefail
          dmg=$(ls dist/*.dmg 2>/dev/null | head -1)
          [ -n "$dmg" ] || { echo "::error::no DMG in dist/ to checksum" >&2; exit 1; }
          sha=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          echo "$sha  $(basename "$dmg")"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload DMG and publish the release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: dist/*.dmg
          draft: false
          # Same pre-release flag as the changelog job's release step above —
          # this step is what actually flips the release out of draft, so it
          # must carry it too.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}

  announce:
    name: Announce on Discord
    # After `build`, because that job is what takes the release out of draft;
    # a failed build published nothing, so a skipped announcement is right.
    needs: build
    uses: ./.github/workflows/announce.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  tap:
    name: Bump the Homebrew cask
    needs: build
    # Homebrew has no concept of a prerelease: whatever lands in the tap is
    # what `brew upgrade` hands every user. Pre-releases therefore skip this
    # and are installed from the releases page instead, the same rule the
    # tap's own README states.
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the bump
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          set -uo pipefail
          [ -n "$SHA" ] || { echo "::error::the build job produced no checksum" >&2; exit 1; }
          for attempt in 1 2 3; do
            if gh workflow run bump.yml --repo NoiXdev/homebrew-tap \
              -f kind=cask \
              -f name=maccommander \
              -f version="${TAG#v}" \
              -f sha256="$SHA"; then
              echo "Dispatched on attempt $attempt."
              exit 0
            fi
            echo "Dispatch attempt $attempt failed."
            sleep 10
          done
          exit 1

      # This job runs after the release is already public. A silent failure
      # here leaves the tap pointing at the previous version, so say exactly
      # what to run by hand. See SETUP.md in NoiXdev/homebrew-tap.
      - name: Explain how to finish the bump by hand
        if: failure()
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          echo "::error::The tap was not bumped. The release is already published,"
          echo "::error::so 'brew install --cask maccommander' still installs the previous version."
          echo "Run it by hand with a token that may dispatch workflows in the tap:"
          echo ""
          echo "  gh workflow run bump.yml --repo NoiXdev/homebrew-tap \\"
          echo "    -f kind=cask -f name=maccommander \\"
          echo "    -f version=${TAG#v} -f sha256=${SHA}"
          echo ""
          echo "A 403 here means TAP_TOKEN cannot dispatch in NoiXdev/homebrew-tap."
          echo "See SETUP.md in that repository for what the token needs."
